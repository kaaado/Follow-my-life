name: lucide_icons
description: A Lucide icon library package for Flutter applications.
version: 0.257.0+compat
homepage: https://lucide.dev

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/lucide.ttf
